server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  servlet:
    context-path: /
    context-parameters:
      app.base-url: ${APP_BASE_URL:https://bunglog.coreluma.kr}

front-url: ${FRONT_URL:https://bunglog.coreluma.kr}
file-uri: ${FILE_URI:https://bunglog.coreluma.kr/file}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://bunglog.coreluma.kr,http://localhost:3000,http://localhost:8080}
  websocket:
    allowed-origins: ${APP_WEBSOCKET_ALLOWED_ORIGINS:https://bunglog.coreluma.kr,http://localhost:3000,http://localhost:8080}

spring:
  sql:
    init:
      mode: always
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    import: optional:application-prod.yml
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        show-sql: true
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  thymeleaf:
    check-template-location: true
    prefix: classpath:/templates/
    suffix: .html
    cache: false
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

springdoc:
  swagger-ui:
    path: /api-test

swagger:
  localUrl: ${SWAGGER_LOCAL_URL:http://localhost:8080}
  prodUrl: ${SWAGGER_PROD_URL:https://bunglog.coreluma.kr/api}

logging:
  level:
    org:
      springframework: debug