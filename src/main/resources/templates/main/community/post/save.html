<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<th:block layout:fragment="views">
    <section class="page-section" id="portfolio">
        <div class="container">
            <form action="/admin/community/post/save.json" method="post" enctype="multipart/form-data">
                <div class="form-floating mb-3">
                    <input type="text" name="title" class="form-control" id="title" placeholder="제목을 입력해주세요." required>
                    <label for="title">제목</label>
                </div>
                <div class="form-floating mb-3">
                    <textarea name="contents" class="form-control" id="contents" style="height : 500px;"></textarea>
                    <label for="contents">내용</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="file" name="pictures" class="form-control" id="pictures" multiple>
                    <label for="pictures">이미지 업로드</label>
                </div>

                <div class="form-floating mb-2">
                    <textarea name="firstOption" class="form-control" id="firstOption"></textarea>
                    <label for="firstOption">투표 A</label>
                </div>

                <div class="form-floating mb-5">
                    <textarea name="secondOption" class="form-control" id="secondOption"></textarea>
                    <label for="secondOption">투표 B</label>
                </div>
                <button class="custom-btn btn-1" type="submit">등록하기</button>
            </form>
        </div>
    </section>
</th:block>
</html>
